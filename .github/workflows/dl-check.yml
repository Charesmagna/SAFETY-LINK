name: Check downloads
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: download links
        run: |
          for p in /download/safetylink.apk /download/v1/safetylink.apk /download/beta/safetylink.apk /api/app/latest; do
            c=$(curl -s -L -m 120 -o /dev/null -w "%{http_code} %{size_download}" https://safetylink-api.tshilidzi-mukwevho54.workers.dev$p)
            echo "::notice::$p -> $c"
          done
